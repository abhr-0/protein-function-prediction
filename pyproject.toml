[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protein-function-prediction"
version = "0.1.0"
description = "Sequence-only protein function prediction on human Swiss-Prot (Track A) and CAFA6 (Track B)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "cafaeval",
]

[project.optional-dependencies]
embed = [
    "torch>=2.6",
    "transformers>=4.48",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pfpred"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
